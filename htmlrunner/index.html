<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced HTML Runner | Kuldeep Rai</title>

<rect width='100' height='100' rx='18' fill='%230f172a'/>
<text x='50%' y='58%' font-size='34' text-anchor='middle' fill='white' font-family='Arial'>KR</text>
</svg>">

<style>

:root{
    --bg:#020617;
    --panel:#0f172a;
    --panel2:#111827;
    --text:#f8fafc;
    --border:rgba(255,255,255,.08);
    --primary:#3b82f6;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* TOPBAR */

.topbar{
    width:100%;
    min-height:70px;
    background:rgba(15,23,42,.96);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 18px;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.logo h2{
    font-size:18px;
}

.logo small{
    color:#94a3b8;
}

/* BUTTONS */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:11px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.run{
    background:var(--primary);
    color:white;
}

.save{
    background:var(--success);
    color:white;
}

.clear{
    background:var(--danger);
    color:white;
}

.full{
    background:var(--warning);
    color:black;
}

/* MAIN */

.main{
    display:flex;
    width:100%;
    height:calc(100vh - 75px);
}

/* PANELS */

.editor-section,
.preview-section{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.section-header{
    height:52px;
    background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    flex-shrink:0;
}

.section-header h3{
    font-size:15px;
}

.stats{
    display:flex;
    gap:15px;
    font-size:13px;
    color:#94a3b8;
}

/* EDITOR */

.editor-container{
    flex:1;
    overflow:hidden;
}

textarea{
    width:100%;
    height:100%;
    border:none;
    outline:none;
    resize:none;
    background:#020617;
    color:#e2e8f0;
    padding:18px;
    font-size:14px;
    line-height:1.7;
    font-family:Consolas,monospace;
}

/* PREVIEW */

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

/* STATUSBAR */

.statusbar{
    height:38px;
    background:#020617;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-size:12px;
    color:#94a3b8;
    flex-shrink:0;
}

/* FULLSCREEN */

.fullscreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:999;
    display:none;
    flex-direction:column;
}

.fullscreen-top{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    flex-shrink:0;
}

.fullscreen iframe{
    flex:1;
}

/* DOWNLOAD MODAL */

.download-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
}

.download-box{
    width:100%;
    max-width:420px;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:25px;
}

.download-box h2{
    text-align:center;
    margin-bottom:20px;
}

.download-box input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:14px;
    padding:0 15px;
    background:#020617;
    color:white;
    font-size:16px;
}

.download-actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.download-actions button{
    flex:1;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    color:white;
    padding:14px 18px;
    border-radius:14px;
    transform:translateY(120px);
    transition:.35s;
    z-index:3000;
}

.toast.show{
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .main{
        flex-direction:column;
        height:auto;
    }

    .editor-section,
    .preview-section{
        height:50vh;
    }

    .actions{
        width:100%;
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .btn{
        width:100%;
    }

}

@media(max-width:500px){

    .topbar{
        padding:14px;
    }

    .logo h2{
        font-size:16px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .stats{
        display:none;
    }

    textarea{
        font-size:13px;
        padding:14px;
    }

    .section-header{
        padding:0 10px;
    }

}

</style>
</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

    <div class="logo">

        <div class="logo-box">
            KR
        </div>

        <div>
            <h2>Advanced HTML Runner</h2>
            <small>Created by Kuldeep Rai</small>
        </div>

    </div>

    <div class="actions">

        <button class="btn run" id="runBtn">
            ▶ Run
        </button>

        <button class="btn save" id="downloadBtn">
            ⬇ Download
        </button>

        <button class="btn full" id="fullscreenBtn">
            ⛶ Fullscreen
        </button>

        <button class="btn clear" id="clearBtn">
            ✖ Clear
        </button>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <!-- EDITOR -->

    <div class="editor-section">

        <div class="section-header">

            <h3>Code Editor</h3>

            <div class="stats">
                <span id="lines">Lines: 0</span>
                <span id="chars">Characters: 0</span>
            </div>

        </div>

        <div class="editor-container">

<textarea id="editor">
<!DOCTYPE html>
<html>
<head>

<title>Advanced Runner</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.card{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:300px;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

    <h1>HTML Runner 🚀</h1>

    <p>Live HTML CSS JS Preview</p>

    <button onclick="hello()">
        Click Me
    </button>

</div>

<script>

function hello(){

    alert("Hello Kuldeep 🚀");

}

</script>

</body>
</html>
</textarea>

        </div>

        <div class="statusbar">

            <span>
                Auto Save Enabled
            </span>

            <span id="typingStatus">
                Ready
            </span>

        </div>

    </div>

    <!-- PREVIEW -->

    <div class="preview-section">

        <div class="section-header">

            <h3>Live Preview</h3>

            <span>
                Realtime Rendering
            </span>

        </div>

        <iframe id="preview"></iframe>

        <div class="statusbar">

            <span>
                Preview Active
            </span>

            <span id="time"></span>

        </div>

    </div>

</div>

<!-- FULLSCREEN -->

<div class="fullscreen" id="fullscreen">

    <div class="fullscreen-top">

        <h3>Fullscreen Preview</h3>

        <button class="btn clear" id="exitFullscreen">
            Exit
        </button>

    </div>

    <iframe id="fullPreview"></iframe>

</div>

<!-- DOWNLOAD MODAL -->

<div id="downloadModal" class="download-modal">

    <div class="download-box">

        <h2>Download File</h2>

        <input
            type="text"
            id="fileNameInput"
            placeholder="Enter file name"
            value="index"
        >

        <div class="download-actions">

            <button id="cancelDownload" class="btn clear">
                Cancel
            </button>

            <button id="confirmDownload" class="btn save">
                Download
            </button>

        </div>

    </div>

</div>

<!-- TOAST -->

<div class="toast" id="toast"></div>

<script>

/* ELEMENTS */

const editor =
document.getElementById("editor");

const preview =
document.getElementById("preview");

const fullPreview =
document.getElementById("fullPreview");

const runBtn =
document.getElementById("runBtn");

const clearBtn =
document.getElementById("clearBtn");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const exitFullscreen =
document.getElementById("exitFullscreen");

const fullscreen =
document.getElementById("fullscreen");

const lines =
document.getElementById("lines");

const chars =
document.getElementById("chars");

const toast =
document.getElementById("toast");

const downloadBtn =
document.getElementById("downloadBtn");

const downloadModal =
document.getElementById("downloadModal");

const fileNameInput =
document.getElementById("fileNameInput");

const confirmDownload =
document.getElementById("confirmDownload");

const cancelDownload =
document.getElementById("cancelDownload");


/* RUN CODE */

function runCode(){

    const code = editor.value;

    preview.srcdoc = code;

    fullPreview.srcdoc = code;

}


/* TOAST */

function showToast(message){

    toast.innerText = message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2000);

}


/* UPDATE STATS */

function updateStats(){

    const code = editor.value;

    lines.innerText =
    "Lines: " +
    code.split("\n").length;

    chars.innerText =
    "Characters: " +
    code.length;

}


/* SAVE TO LOCAL STORAGE */

function saveCode(){

    localStorage.setItem(
        "advanced_html_runner_code",
        editor.value
    );

}


/* LOAD SAVED CODE */

function loadSavedCode(){

    const saved =
    localStorage.getItem(
        "advanced_html_runner_code"
    );

    if(saved){

        editor.value = saved;

    }

}


/* INITIAL LOAD */

window.onload = ()=>{

    loadSavedCode();

    runCode();

    updateStats();

};


/* AUTO RUN */

let debounce;

editor.addEventListener("input",()=>{

    clearTimeout(debounce);

    debounce = setTimeout(()=>{

        runCode();

    },700);

    updateStats();

    saveCode();

});


/* RUN BUTTON */

runBtn.onclick = ()=>{

    runCode();

    showToast("Preview Updated 🚀");

};


/* CLEAR BUTTON */

clearBtn.onclick = ()=>{

    if(confirm("Clear all code?")){

        editor.value = "";

        runCode();

        updateStats();

        saveCode();

        showToast("Editor Cleared");

    }

};


/* FULLSCREEN */

fullscreenBtn.onclick = ()=>{

    fullscreen.style.display = "flex";

    fullPreview.srcdoc =
    editor.value;

};


exitFullscreen.onclick = ()=>{

    fullscreen.style.display = "none";

};


/* ESC CLOSE */

document.addEventListener("keydown",(e)=>{

    if(e.key === "Escape"){

        fullscreen.style.display = "none";

        downloadModal.style.display = "none";

    }

});


/* OPEN DOWNLOAD MODAL */

downloadBtn.onclick = ()=>{

    downloadModal.style.display = "flex";

    fileNameInput.focus();

};


/* DOWNLOAD FILE */

confirmDownload.onclick = ()=>{

    let fileName =
    fileNameInput.value.trim();

    if(fileName === ""){

        fileName = "index";

    }

    const blob = new Blob(
        [editor.value],
        {
            type:"text/html"
        }
    );

    const a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    fileName + ".html";

    a.click();

    downloadModal.style.display = "none";

    showToast("Downloaded Successfully 🚀");

};


/* CANCEL DOWNLOAD */

cancelDownload.onclick = ()=>{

    downloadModal.style.display = "none";

};


/* OUTSIDE CLICK CLOSE */

downloadModal.addEventListener("click",(e)=>{

    if(e.target === downloadModal){

        downloadModal.style.display = "none";

    }

});


/* LIVE CLOCK */

setInterval(()=>{

    const now = new Date();

    document.getElementById("time")
    .innerText =
    now.toLocaleTimeString();

},1000);

</script>

</body>
</html>
