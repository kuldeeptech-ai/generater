<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
HTML Runner Pro
</title>

<style>

:root{

    --bg:#020617;
    --panel:#0f172a;
    --panel2:#111827;

    --text:#f8fafc;

    --border:
    rgba(255,255,255,.08);

    --primary:#3b82f6;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #111827);

    color:white;

    font-family:Arial,sans-serif;

    height:100vh;

    overflow:hidden;
}

/* TOPBAR */

.topbar{

    width:100%;

    min-height:72px;

    background:
    rgba(15,23,42,.95);

    border-bottom:
    1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:14px 18px;

    flex-wrap:wrap;
}

.logo{

    display:flex;

    align-items:center;

    gap:12px;
}

.logo-box{

    width:46px;

    height:46px;

    border-radius:14px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    font-weight:bold;
}

.logo small{
    color:#94a3b8;
}

/* BUTTONS */

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.btn{

    border:none;

    padding:11px 18px;

    border-radius:12px;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.run{
    background:var(--primary);
    color:white;
}

.save{
    background:var(--success);
    color:white;
}

.clear{
    background:var(--danger);
    color:white;
}

.full{
    background:var(--warning);
    color:black;
}

/* MAIN */

.main{

    width:100%;

    height:calc(100vh - 76px);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    padding:12px;

    overflow:hidden;
}

/* PANELS */

.panel{

    width:100%;

    height:100%;

    min-width:0;

    min-height:0;

    display:flex;

    flex-direction:column;

    background:#0f172a;

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:18px;

    overflow:hidden;
}

/* PANEL HEADER */

.panel-header{

    width:100%;

    min-height:54px;

    background:
    rgba(255,255,255,.03);

    border-bottom:
    1px solid rgba(255,255,255,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    flex-shrink:0;
}

.panel-header h3{
    font-size:15px;
}

.panel-status{

    font-size:12px;

    color:#94a3b8;
}

/* EDITOR */

.editor-wrap{

    flex:1;

    width:100%;

    min-height:0;

    overflow:hidden;

    background:#020617;
}

textarea{

    width:100%;

    height:100%;

    min-height:100%;

    border:none;

    outline:none;

    resize:none;

    background:#020617;

    color:#e2e8f0;

    padding:18px;

    font-size:14px;

    line-height:1.7;

    font-family:Consolas,monospace;

    overflow:auto;

    white-space:pre;

    display:block;
}

/* PREVIEW */

.preview-wrap{

    flex:1;

    width:100%;

    min-height:0;

    overflow:hidden;

    background:white;

    position:relative;
}

iframe{

    width:100%;

    height:100%;

    min-height:100%;

    border:none;

    background:white;

    display:block;
}

/* STATUSBAR */

.statusbar{

    width:100%;

    min-height:42px;

    background:#020617;

    border-top:
    1px solid rgba(255,255,255,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    font-size:12px;

    color:#94a3b8;

    flex-shrink:0;

    overflow:hidden;
}

/* RUN STATUS */

.run-status{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;
}

.run-status span{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
    0 0 10px #22c55e;
}

/* FULLSCREEN */

.fullscreen{

    position:fixed;

    inset:0;

    background:black;

    z-index:999;

    display:none;

    flex-direction:column;
}

.fullscreen-top{

    height:60px;

    background:#111827;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;
}

.fullscreen iframe{
    flex:1;
}

/* DOWNLOAD MODAL */

.download-modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.75);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:2000;

    backdrop-filter:blur(8px);

    padding:20px;
}

.download-box{

    width:100%;

    max-width:420px;

    background:#111827;

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:25px;
}

.download-box h2{

    text-align:center;

    margin-bottom:20px;
}

.download-box input{

    width:100%;

    height:55px;

    border:none;

    outline:none;

    border-radius:14px;

    background:#020617;

    color:white;

    padding:0 15px;

    font-size:15px;
}

.download-actions{

    display:flex;

    gap:12px;

    margin-top:20px;
}

.download-actions button{
    flex:1;
}

/* TOAST */

.toast{

    position:fixed;

    right:20px;

    bottom:20px;

    background:#111827;

    border:
    1px solid rgba(255,255,255,.08);

    padding:14px 18px;

    border-radius:14px;

    transform:translateY(120px);

    transition:.35s;

    z-index:3000;
}

.toast.show{
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .main{

        grid-template-columns:1fr;

        height:auto;

        overflow:auto;
    }

    .panel{

        min-height:520px;
    }

    .editor-wrap{

        min-height:350px;
    }

    .preview-wrap{

        min-height:350px;
    }

    .actions{

        width:100%;

        display:grid;

        grid-template-columns:
        repeat(2,1fr);
    }

    .btn{
        width:100%;
    }

    textarea{
        font-size:13px;
    }
}

@media(max-width:500px){

    .actions{
        grid-template-columns:1fr;
    }

    .main{

        padding:8px;

        gap:8px;
    }

    .panel{

        min-height:450px;

        border-radius:14px;
    }

    .editor-wrap{

        min-height:300px;
    }

    .preview-wrap{

        min-height:300px;
    }

    textarea{

        padding:14px;

        font-size:12px;

        line-height:1.6;
    }

    .panel-header{

        padding:0 10px;
    }

    .statusbar{

        padding:0 10px;

        font-size:11px;
    }

    .panel-status{
        display:none;
    }
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

    <div class="logo">

        <div class="logo-box">
            KR
        </div>

        <div>

            <h2>
                HTML Runner Pro
            </h2>

            <small>
                Created by Kuldeep Rai
            </small>

        </div>

    </div>

    <div class="actions">

        <button
        class="btn run"
        id="runBtn">

            ▶ Run

        </button>

        <button
        class="btn save"
        id="downloadBtn">

            ⬇ Download

        </button>

        <button
        class="btn full"
        id="fullscreenBtn">

            ⛶ Fullscreen

        </button>

        <button
        class="btn clear"
        id="clearBtn">

            ✖ Clear

        </button>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <!-- CODE PANEL -->

    <div class="panel">

        <div class="panel-header">

            <h3>
                Code Editor
            </h3>

            <div class="panel-status">

                <span id="lines">
                    Lines: 0
                </span>

                •

                <span id="chars">
                    Characters: 0
                </span>

            </div>

        </div>

        <div class="editor-wrap">

<textarea id="editor">
<!DOCTYPE html>
<html>

<head>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#0f172a;

    color:white;

    font-family:Arial;
}

.card{

    background:#1e293b;

    padding:40px;

    border-radius:20px;

    text-align:center;
}

button{

    background:#3b82f6;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:10px;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

    <h1>
        HTML Runner 🚀
    </h1>

    <p>
        Live HTML CSS JS Preview
    </p>

    <button onclick="hello()">
        Click Me
    </button>

</div>

<script>

function hello(){

    alert(
    "Hello Kuldeep 🚀"
    );

}

</script>

</body>
</html>
</textarea>

        </div>

        <div class="statusbar">

            <div class="run-status">

                <div class="dot"></div>

                <span id="editorStatus">
                    Editor Ready
                </span>

            </div>

            <span>
                Auto Save Enabled
            </span>

        </div>

    </div>

    <!-- PREVIEW PANEL -->

    <div class="panel">

        <div class="panel-header">

            <h3>
                Live Preview
            </h3>

            <div class="panel-status">

                <span id="previewStatus">
                    Running
                </span>

            </div>

        </div>

        <div class="preview-wrap">

            <iframe id="preview"></iframe>

        </div>

        <div class="statusbar">

            <div class="run-status">

                <div class="dot"></div>

                <span id="runTime">
                    Live Preview Active
                </span>

            </div>

            <span id="time"></span>

        </div>

    </div>

</div>

<!-- FULLSCREEN -->

<div class="fullscreen"
id="fullscreen">

    <div class="fullscreen-top">

        <h3>
            Fullscreen Preview
        </h3>

        <button
        class="btn clear"
        id="exitFullscreen">

            Exit

        </button>

    </div>

    <iframe id="fullPreview"></iframe>

</div>

<!-- DOWNLOAD MODAL -->

<div class="download-modal"
id="downloadModal">

    <div class="download-box">

        <h2>
            Download File
        </h2>

        <input
        type="text"
        id="fileNameInput"
        value="index"
        placeholder="Enter file name">

        <div class="download-actions">

            <button
            class="btn clear"
            id="cancelDownload">

                Cancel

            </button>

            <button
            class="btn save"
            id="confirmDownload">

                Download

            </button>

        </div>

    </div>

</div>

<!-- TOAST -->

<div class="toast"
id="toast"></div>

<script>

/* ELEMENTS */

const editor =
document.getElementById(
"editor"
);

const preview =
document.getElementById(
"preview"
);

const fullPreview =
document.getElementById(
"fullPreview"
);

const runBtn =
document.getElementById(
"runBtn"
);

const clearBtn =
document.getElementById(
"clearBtn"
);

const fullscreenBtn =
document.getElementById(
"fullscreenBtn"
);

const exitFullscreen =
document.getElementById(
"exitFullscreen"
);

const fullscreen =
document.getElementById(
"fullscreen"
);

const lines =
document.getElementById(
"lines"
);

const chars =
document.getElementById(
"chars"
);

const toast =
document.getElementById(
"toast"
);

const editorStatus =
document.getElementById(
"editorStatus"
);

const previewStatus =
document.getElementById(
"previewStatus"
);

const runTime =
document.getElementById(
"runTime"
);

const downloadBtn =
document.getElementById(
"downloadBtn"
);

const downloadModal =
document.getElementById(
"downloadModal"
);

const fileNameInput =
document.getElementById(
"fileNameInput"
);

const confirmDownload =
document.getElementById(
"confirmDownload"
);

const cancelDownload =
document.getElementById(
"cancelDownload"
);

/* RUN CODE */

function runCode(){

    const code =
    editor.value;

    preview.srcdoc =
    code;

    fullPreview.srcdoc =
    code;

    previewStatus.innerText =
    "Running Successfully";

    runTime.innerText =
    "Last Run: " +
    new Date()
    .toLocaleTimeString();

    editorStatus.innerText =
    "Code Executed";
}

/* TOAST */

function showToast(message){

    toast.innerText =
    message;

    toast.classList.add(
    "show"
    );

    setTimeout(()=>{

        toast.classList.remove(
        "show"
        );

    },2000);
}

/* STATS */

function updateStats(){

    const code =
    editor.value;

    lines.innerText =
    "Lines: " +
    code.split("\n").length;

    chars.innerText =
    "Characters: " +
    code.length;
}

/* SAVE */

function saveCode(){

    localStorage.setItem(
    "runner_pro_code",
    editor.value
    );
}

/* LOAD */

function loadCode(){

    const saved =
    localStorage.getItem(
    "runner_pro_code"
    );

    if(saved){

        editor.value =
        saved;
    }
}

/* INIT */

window.onload = ()=>{

    loadCode();

    runCode();

    updateStats();
};

/* AUTO RUN */

let debounce;

editor.addEventListener(
"input",()=>{

    clearTimeout(
    debounce
    );

    editorStatus.innerText =
    "Typing...";

    debounce =
    setTimeout(()=>{

        runCode();

    },700);

    updateStats();

    saveCode();
});

/* RUN BUTTON */

runBtn.onclick = ()=>{

    runCode();

    showToast(
    "Preview Updated 🚀"
    );
};

/* CLEAR */

clearBtn.onclick = ()=>{

    if(confirm(
    "Clear all code?"
    )){

        editor.value =
        "";

        runCode();

        updateStats();

        saveCode();

        showToast(
        "Editor Cleared"
        );
    }
};

/* FULLSCREEN */

fullscreenBtn.onclick = ()=>{

    fullscreen.style.display =
    "flex";

    fullPreview.srcdoc =
    editor.value;
};

exitFullscreen.onclick = ()=>{

    fullscreen.style.display =
    "none";
};

/* ESC */

document.addEventListener(
"keydown",(e)=>{

    if(e.key === "Escape"){

        fullscreen.style.display =
        "none";

        downloadModal.style.display =
        "none";
    }
});

/* DOWNLOAD */

downloadBtn.onclick = ()=>{

    downloadModal.style.display =
    "flex";

    fileNameInput.focus();
};

confirmDownload.onclick = ()=>{

    let fileName =
    fileNameInput.value.trim();

    if(fileName === ""){

        fileName =
        "index";
    }

    const blob =
    new Blob(
    [editor.value],
    {
        type:"text/html"
    });

    const a =
    document.createElement(
    "a"
    );

    a.href =
    URL.createObjectURL(
    blob
    );

    a.download =
    fileName + ".html";

    a.click();

    downloadModal.style.display =
    "none";

    showToast(
    "Downloaded Successfully 🚀"
    );
};

cancelDownload.onclick = ()=>{

    downloadModal.style.display =
    "none";
};

downloadModal.addEventListener(
"click",(e)=>{

    if(e.target ===
    downloadModal){

        downloadModal.style.display =
        "none";
    }
});

/* CLOCK */

setInterval(()=>{

    const now =
    new Date();

    document.getElementById(
    "time"
    ).innerText =
    now.toLocaleTimeString();

},1000);

</script>

</body>
</html>
