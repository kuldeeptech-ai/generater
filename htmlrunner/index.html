<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Advanced HTML Runner | Kuldeep Rai</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='18' fill='%230f172a'/>
<text x='50%' y='56%' font-size='34' text-anchor='middle' fill='white' font-family='Arial'>KR</text>
</svg>">

<style>
:root{
    --bg:#0f172a;
    --panel:#111827;
    --panel2:#1e293b;
    --text:#f8fafc;
    --border:rgba(255,255,255,.08);
    --primary:#3b82f6;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.topbar{
    height:65px;
    background:rgba(15,23,42,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.logo h2{
    font-size:18px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.run{
    background:var(--primary);
    color:white;
}

.clear{
    background:var(--danger);
    color:white;
}

.save{
    background:var(--success);
    color:white;
}

.full{
    background:var(--warning);
    color:black;
}

.main{
    display:flex;
    height:calc(100vh - 65px);
}

@media(max-width:900px){
    .main{
        flex-direction:column;
    }
}

.editor-section,
.preview-section{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.section-header{
    height:52px;
    background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.section-header h3{
    font-size:15px;
}

.editor-container{
    flex:1;
    position:relative;
}

textarea{
    width:100%;
    height:100%;
    resize:none;
    border:none;
    outline:none;
    background:#020617;
    color:#e2e8f0;
    padding:20px;
    font-size:15px;
    line-height:1.7;
    font-family:Consolas,monospace;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

.statusbar{
    height:36px;
    background:#020617;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-size:13px;
    color:#94a3b8;
}

.fullscreen{
    position:fixed;
    inset:0;
    background:#000;
    z-index:999;
    display:none;
    flex-direction:column;
}

.fullscreen-top{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.fullscreen iframe{
    flex:1;
}

.stats{
    display:flex;
    gap:15px;
    font-size:13px;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:white;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid var(--border);
    transform:translateY(100px);
    transition:.35s;
    z-index:1000;
}

.toast.show{
    transform:translateY(0);
}

</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        <div class="logo-box">KR</div>
        <div>
            <h2>Advanced HTML Runner</h2>
            <small>Created by Kuldeep Rai</small>
        </div>
    </div>

    <div class="actions">
        <button class="btn run" id="runBtn">▶ Run</button>
        <button class="btn save" id="downloadBtn">⬇ Download</button>
        <button class="btn full" id="fullscreenBtn">⛶ Fullscreen</button>
        <button class="btn clear" id="clearBtn">✖ Clear</button>
    </div>

</div>

<div class="main">

    <!-- EDITOR -->
    <div class="editor-section">

        <div class="section-header">
            <h3>Code Editor</h3>

            <div class="stats">
                <span id="lines">Lines: 0</span>
                <span id="chars">Characters: 0</span>
            </div>
        </div>

        <div class="editor-container">

<textarea id="editor">
<!DOCTYPE html>
<html>
<head>
<title>Advanced Runner</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
}

.card{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:320px;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="card">
    <h1>Advanced HTML Runner</h1>
    <p>Live HTML CSS JS Preview</p>

    <button onclick="hello()">
        Click Me
    </button>
</div>

<script>
function hello(){
    alert("Hello Kuldeep 🚀");
}
</script>

</body>
</html>
</textarea>

        </div>

        <div class="statusbar">
            <span>Auto Save Enabled</span>
            <span id="typingStatus">Ready</span>
        </div>

    </div>

    <!-- PREVIEW -->
    <div class="preview-section">

        <div class="section-header">
            <h3>Live Preview</h3>
            <span>Realtime Rendering</span>
        </div>

        <iframe id="preview"></iframe>

        <div class="statusbar">
            <span>Preview Active</span>
            <span id="time"></span>
        </div>

    </div>

</div>

<!-- FULLSCREEN -->
<div class="fullscreen" id="fullscreen">

    <div class="fullscreen-top">
        <h3>Fullscreen Preview</h3>

        <button class="btn clear" id="exitFullscreen">
            Exit
        </button>
    </div>

    <iframe id="fullPreview"></iframe>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const fullPreview = document.getElementById("fullPreview");

const runBtn = document.getElementById("runBtn");
const clearBtn = document.getElementById("clearBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreen = document.getElementById("exitFullscreen");
const fullscreen = document.getElementById("fullscreen");
const downloadBtn = document.getElementById("downloadBtn");

const lines = document.getElementById("lines");
const chars = document.getElementById("chars");
const toast = document.getElementById("toast");


// RUN CODE
function runCode(){

    const code = editor.value;

    preview.srcdoc = code;
    fullPreview.srcdoc = code;

    localStorage.setItem("advanced_runner_code", code);

    showToast("Preview Updated 🚀");
}


// TOAST
function showToast(msg){

    toast.innerText = msg;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2000);
}


// STATS
function updateStats(){

    const code = editor.value;

    lines.innerText =
    "Lines: " + code.split("\n").length;

    chars.innerText =
    "Characters: " + code.length;
}


// AUTOSAVE LOAD
window.onload = ()=>{

    const saved =
    localStorage.getItem("advanced_runner_code");

    if(saved){
        editor.value = saved;
    }

    runCode();
    updateStats();
};


// AUTO RUN
let debounce;

editor.addEventListener("input",()=>{

    clearTimeout(debounce);

    debounce = setTimeout(()=>{

        runCode();

    },700);

    updateStats();
});


// BUTTONS
runBtn.onclick = runCode;

clearBtn.onclick = ()=>{

    if(confirm("Clear all code?")){

        editor.value = "";

        runCode();

        updateStats();

        showToast("Editor Cleared");
    }
};


// FULLSCREEN
fullscreenBtn.onclick = ()=>{

    fullscreen.style.display = "flex";

    fullPreview.srcdoc = editor.value;
};

exitFullscreen.onclick = ()=>{

    fullscreen.style.display = "none";
};


// ESC CLOSE
document.addEventListener("keydown",(e)=>{

    if(e.key === "Escape"){
        fullscreen.style.display = "none";
    }
});


// DOWNLOAD
downloadBtn.onclick = ()=>{

    const blob = new Blob(
        [editor.value],
        {type:"text/html"}
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "index.html";

    a.click();

    showToast("HTML Downloaded");
};


// CLOCK
setInterval(()=>{

    const now = new Date();

    document.getElementById("time")
    .innerText =
    now.toLocaleTimeString();

},1000);

</script>

</body>
</html>
