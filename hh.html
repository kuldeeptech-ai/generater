<!DOCTYPE html>
<html>
<head>
  <title>DASH Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    body { margin:0; background:#000; }
    video {
      width:100%;
      height:100vh;
      background:#000;
    }
  </style>
</head>
<body>

<video id="video" controls autoplay></video>

<script>
  async function initPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    const url = "https://jiotvpllive.cdn.jio.com//bpk-tv/Star_Sports_HD1_BTS/WDVLive/dash/Star_Sports_HD1_BTS-video=4175600-1066273994777.dash?__hdnea__=st=1777122621~exp=1777144221~acl=/bpk-tv/Star_Sports_HD1_BTS/WDVLive/*~hmac=934bae248f443fd14e10af5170629dab79c60daa647a264228fb77d02437c0bb"; // 👈 yaha apna DASH (.mpd) link daalo

    try {
      await player.load(url);
      console.log("Video loaded");
    } catch (e) {
      console.error("Error loading video", e);
    }
  }

  document.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
